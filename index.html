<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineX API Project</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="logo"><span>C</span>ine<span>X</span></h1>
        </div>
        <div class="search-section">
            <input type="text" placeholder="Search......." id="inputText">
            <div class="sort-container">
                <label for="yearSort">Sort By Year:</label>

                <select id="yearSort">
                    <option value="">Select</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>
            </div>
        </div>
        <div class="overlay" id="overlay"></div>
        <div class="trending-section" id="trendingSection">
            <h1>🔥Trending Section</h1>
            <div class="slide">
                <i class="fa-solid fa-arrow-left" id="tredPrev"></i>
                <i class="fa-solid fa-arrow-right" id="tredNext"></i>
            </div>
            <div class="wrapper">
                <div class="trending-grid" id="trendingGrid"></div>
            </div>
        </div>

        <div id="movieDetail"></div>

        <div class="discover-Movies" id="discoverMovies"></div>

    </div>
    <script src="js/main.js"></script>
</body>

</html>
